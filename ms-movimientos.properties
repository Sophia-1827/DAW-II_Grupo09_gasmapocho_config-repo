# PostgreSQL local (puerto 5432). Cuando se tenga la base en la nube (Aiven/Supabase),
# solo se reemplaza la URL/usuario/password; el resto del codigo no cambia.
spring.datasource.url=jdbc:postgresql://localhost:5432/gasmapocho_movimientos
spring.datasource.driver-class-name=org.postgresql.Driver
# Aqui NO se escribe el usuario ni la contrasena de PostgreSQL: cada quien los define como variables de entorno
# DB_USER y DB_PASSWORD en su PC (ver README del repo principal).
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Circuit breaker para la llamada Feign hacia ms-balones (Resilience4j)
# cantidad de peticiones a evaluar
resilience4j.circuitbreaker.instances.balonClient.sliding-window-size=4
# minimo de peticiones antes de calcular el porcentaje de fallo
resilience4j.circuitbreaker.instances.balonClient.minimum-number-of-calls=2
# porcentaje de peticiones fallidas para abrir el circuito
resilience4j.circuitbreaker.instances.balonClient.failure-rate-threshold=50
# tiempo que el circuito queda abierto antes de volver a probar
resilience4j.circuitbreaker.instances.balonClient.wait-duration-in-open-state=15s
# cantidad de peticiones permitidas en estado semi-abierto
resilience4j.circuitbreaker.instances.balonClient.permitted-number-of-calls-in-half-open-state=2
# un balon inexistente (404) es un caso de negocio, no una falla del servicio
resilience4j.circuitbreaker.instances.balonClient.ignore-exceptions=feign.FeignException.NotFound

# Circuit breaker para la consulta de proveedores hacia ms-balones (misma configuracion que balonClient)
resilience4j.circuitbreaker.instances.proveedorClient.sliding-window-size=4
resilience4j.circuitbreaker.instances.proveedorClient.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.proveedorClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.proveedorClient.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.proveedorClient.permitted-number-of-calls-in-half-open-state=2
# un proveedor inexistente (404) es un caso de negocio, no una falla del servicio
resilience4j.circuitbreaker.instances.proveedorClient.ignore-exceptions=feign.FeignException.NotFound
