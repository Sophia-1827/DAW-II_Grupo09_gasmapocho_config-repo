# PostgreSQL local (puerto 5432).
# solo se reemplaza la URL/usuario/password; el resto del codigo no cambia.
spring.datasource.url=jdbc:postgresql://localhost:5432/gasmapocho_balones
spring.datasource.driver-class-name=org.postgresql.Driver
# Aqui NO se escribe el usuario ni la contrasena de PostgreSQL: cada quien los define como variables de entorno
# DB_USER y DB_PASSWORD en su PC (ver README del repo principal).
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
